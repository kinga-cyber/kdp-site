<text x="669" y="629.0" fill="#BA9200" font-size="16" font-weight="600">the spec</text>
<path d="M 882.5 724 L 882.5 739.0 L 317.5 739.0 L 317.5 750" fill="none" stroke="#3F455D" stroke-opacity="0.4" stroke-width="2"/>
