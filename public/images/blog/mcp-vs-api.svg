<line x1="60" y1="552" x2="1140" y2="552" stroke="#BA9200" stroke-opacity="0.35"/>
<text x="60" y="586" fill="#3F455D" font-size="18" opacity="0.8">The line is not reads against writes. It is content against infrastructure.</text>
