<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Arial, Helvetica, sans-serif">
  <rect width="1200" height="630" fill="#F6EFE6"/>

  <!-- kicker + headline -->
  <rect x="70" y="72" width="46" height="4" rx="2" fill="#BA9200"/>
  <text x="126" y="80" font-size="20" letter-spacing="3" font-weight="700" fill="#BA9200">KLAVIYO FLOW AUDIT</text>
  <text x="70" y="132" font-size="44" font-weight="800" fill="#3F455D">The tool finds it. The workflow fixes it.</text>

  <!-- LEFT CARD: Composer, finds + recommends -->
  <rect x="70" y="182" width="470" height="376" rx="16" fill="#FFFFFF" stroke="#3F455D" stroke-opacity="0.12"/>
  <rect x="70" y="182" width="470" height="64" rx="16" fill="#3F455D"/>
  <rect x="70" y="214" width="470" height="32" fill="#3F455D"/>
  <text x="98" y="223" font-size="22" font-weight="800" fill="#FFFFFF">COMPOSER</text>
  <text x="98" y="235" font-size="13" letter-spacing="1" fill="#F6EFE6" fill-opacity="0.85">FINDS + RECOMMENDS</text>

  <!-- findings list -->
  <g>
    <circle cx="112" cy="300" r="7" fill="#BA9200"/>
    <rect x="132" y="293" width="360" height="14" rx="7" fill="#3F455D" fill-opacity="0.14"/>
    <circle cx="112" cy="344" r="7" fill="#BA9200"/>
    <rect x="132" y="337" width="330" height="14" rx="7" fill="#3F455D" fill-opacity="0.14"/>
    <circle cx="112" cy="388" r="7" fill="#BA9200"/>
    <rect x="132" y="381" width="360" height="14" rx="7" fill="#3F455D" fill-opacity="0.14"/>
    <circle cx="112" cy="432" r="7" fill="#BA9200"/>
    <rect x="132" y="425" width="300" height="14" rx="7" fill="#3F455D" fill-opacity="0.14"/>
    <circle cx="112" cy="476" r="7" fill="#BA9200"/>
    <rect x="132" y="469" width="345" height="14" rx="7" fill="#3F455D" fill-opacity="0.14"/>
  </g>
  <text x="98" y="528" font-size="15" fill="#333333" fill-opacity="0.7">A list of what is broken.</text>

  <!-- hand-off arrow -->
  <circle cx="600" cy="380" r="34" fill="#BA9200"/>
  <path d="M586 380 h22 m-9 -9 l9 9 l-9 9" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- RIGHT CARD: Workflow, decides + fixes -->
  <rect x="660" y="182" width="470" height="376" rx="16" fill="#FFFFFF" stroke="#3F455D" stroke-opacity="0.12"/>
  <rect x="660" y="182" width="470" height="64" rx="16" fill="#59A56D"/>
  <rect x="660" y="214" width="470" height="32" fill="#59A56D"/>
  <text x="688" y="223" font-size="22" font-weight="800" fill="#FFFFFF">WORKFLOW</text>
  <text x="688" y="235" font-size="13" letter-spacing="1" fill="#FFFFFF" fill-opacity="0.9">DECIDES + FIXES</text>

  <!-- flow nodes with actions applied -->
  <g>
    <!-- node 1: fixed -->
    <rect x="688" y="286" width="300" height="44" rx="10" fill="#F6EFE6" stroke="#59A56D" stroke-width="2"/>
    <circle cx="1064" cy="308" r="17" fill="#59A56D"/>
    <path d="M1056 308 l6 6 l10 -12" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- connector -->
    <rect x="734" y="330" width="3" height="24" fill="#3F455D" fill-opacity="0.2"/>
    <!-- node 2: switched off (duplicate) -->
    <rect x="688" y="354" width="300" height="44" rx="10" fill="#FFFFFF" stroke="#333333" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="6 5"/>
    <circle cx="1064" cy="376" r="17" fill="#333333" fill-opacity="0.35"/>
    <rect x="1055" y="374" width="18" height="4" rx="2" fill="#FFFFFF"/>
    <!-- connector -->
    <rect x="734" y="398" width="3" height="24" fill="#3F455D" fill-opacity="0.2"/>
    <!-- node 3: fixed -->
    <rect x="688" y="422" width="300" height="44" rx="10" fill="#F6EFE6" stroke="#59A56D" stroke-width="2"/>
    <circle cx="1064" cy="444" r="17" fill="#59A56D"/>
    <path d="M1056 444 l6 6 l10 -12" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="688" y="520" font-size="15" fill="#333333" fill-opacity="0.7">The changes, made in the account.</text>
</svg>
