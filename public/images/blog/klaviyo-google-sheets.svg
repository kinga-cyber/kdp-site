<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif">
<rect width="1200" height="630" fill="#F6EFE6"/>

<text x="50" y="56" fill="#3F455D" font-size="14" font-weight="600" letter-spacing="2" opacity="0.6">KLAVIYO TO GOOGLE SHEETS</text>
<text x="50" y="104" fill="#3F455D" font-size="34" font-weight="600">Three routes, two of them free</text>
<text x="50" y="140" fill="#333333" font-size="19" opacity="0.85">There is no native integration. What you pay for is not the export, it is the cadence.</text>

<text x="80" y="192" fill="#3F455D" font-size="12.5" font-weight="700" letter-spacing="1.5" opacity="0.6">ROUTE</text>
<text x="400" y="192" fill="#3F455D" font-size="12.5" font-weight="700" letter-spacing="1.5" opacity="0.6">WHAT YOU GET</text>
<text x="790" y="192" fill="#3F455D" font-size="12.5" font-weight="700" letter-spacing="1.5" opacity="0.6">CADENCE</text>
<text x="1020" y="192" fill="#3F455D" font-size="12.5" font-weight="700" letter-spacing="1.5" opacity="0.6">COST</text>

<rect x="50" y="212" width="1100" height="104" rx="7" fill="#FFFFFF" stroke="#3F455D" stroke-opacity="0.35" stroke-width="2"/>
<rect x="50" y="212" width="5" height="104" rx="2.5" fill="#3F455D" fill-opacity="0.35"/>
<text x="80" y="272" fill="#3F455D" font-size="21" font-weight="600">CSV export</text>
<text x="400" y="272" fill="#333333" font-size="17.5" opacity="0.9">One snapshot of a standard report</text>
<text x="790" y="272" fill="#333333" font-size="17.5" opacity="0.9">Once, by hand</text>
<text x="1020" y="272" fill="#3F455D" font-size="17.5" font-weight="600">Free</text>

<rect x="50" y="330" width="1100" height="104" rx="7" fill="#FFFFFF" stroke="#3F455D" stroke-opacity="0.35" stroke-width="2"/>
<rect x="50" y="330" width="5" height="104" rx="2.5" fill="#BA9200" fill-opacity="0.7"/>
<text x="80" y="390" fill="#3F455D" font-size="21" font-weight="600">Connector tool</text>
<text x="400" y="390" fill="#333333" font-size="17.5" opacity="0.9">Fixed columns, refreshed for you</text>
<text x="790" y="390" fill="#333333" font-size="17.5" opacity="0.9">Scheduled</text>
<text x="1020" y="390" fill="#BA9200" font-size="17.5" font-weight="600">Paid</text>

<rect x="50" y="448" width="1100" height="104" rx="7" fill="#59A56D" fill-opacity="0.08" stroke="#59A56D" stroke-opacity="0.6" stroke-width="2"/>
<rect x="50" y="448" width="5" height="104" rx="2.5" fill="#59A56D"/>
<text x="80" y="496" fill="#3F455D" font-size="21" font-weight="600">Claude + Klaviyo MCP</text>
<text x="80" y="522" fill="#59A56D" font-size="13" font-weight="600" letter-spacing="1.2">NO API, NO CODE</text>
<text x="400" y="508" fill="#333333" font-size="17.5" opacity="0.9">Any cut of the data you can describe</text>
<text x="790" y="508" fill="#333333" font-size="17.5" opacity="0.9">On demand</text>
<text x="1020" y="508" fill="#59A56D" font-size="17.5" font-weight="600">Free</text>

<text x="50" y="596" fill="#3F455D" font-size="18" font-weight="500" opacity="0.9">A connector sells you a schedule. The MCP answers a question.</text>
</svg>
