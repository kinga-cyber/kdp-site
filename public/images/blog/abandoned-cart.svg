<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif">
<rect width="1200" height="630" fill="#F6EFE6"/>
<text x="600.0" y="98" text-anchor="middle" fill="#3F455D" font-size="38" font-weight="600">Three emails, three jobs</text>
<text x="600.0" y="140" text-anchor="middle" fill="#333333" font-size="20" opacity="0.85">Who is still reading changes at every step, so the email should too.</text>
<rect x="100" y="214" width="316" height="176" rx="10" fill="#ffffff" stroke="#3F455D" stroke-width="2" stroke-opacity="0.4"/><text x="258" y="262" text-anchor="middle" fill="#3F455D" font-size="25" font-weight="600">Reminder</text><text x="258" y="300" text-anchor="middle" fill="#BA9200" font-size="18" font-weight="500">no discount</text><text x="258" y="352" text-anchor="middle" fill="#59A56D" font-size="16" font-weight="600">interrupted checkout</text><line x1="419.0" y1="302" x2="431" y2="302" stroke="#BA9200" stroke-width="3"/><polygon points="439,302 429,296 429,308" fill="#BA9200"/><rect x="442" y="214" width="316" height="176" rx="10" fill="#ffffff" stroke="#3F455D" stroke-width="2" stroke-opacity="0.4"/><text x="600" y="262" text-anchor="middle" fill="#3F455D" font-size="25" font-weight="600">Objection</text><text x="600" y="300" text-anchor="middle" fill="#BA9200" font-size="18" font-weight="500">reviews, shipping, sizing</text><text x="600" y="352" text-anchor="middle" fill="#59A56D" font-size="16" font-weight="600">real hesitation</text><line x1="761.0" y1="302" x2="773" y2="302" stroke="#BA9200" stroke-width="3"/><polygon points="781,302 771,296 771,308" fill="#BA9200"/><rect x="784" y="214" width="316" height="176" rx="10" fill="#ffffff" stroke="#3F455D" stroke-width="2" stroke-opacity="0.4"/><text x="942" y="262" text-anchor="middle" fill="#3F455D" font-size="25" font-weight="600">Incentive</text><text x="942" y="300" text-anchor="middle" fill="#BA9200" font-size="18" font-weight="500">only if you use one</text><text x="942" y="352" text-anchor="middle" fill="#59A56D" font-size="16" font-weight="600">saw two, did not act</text>
<text x="600.0" y="470" text-anchor="middle" fill="#3F455D" font-size="18" opacity="0.6">Discounting the first email hands margin to people who only needed a link back.</text>
<text x="600.0" y="552" text-anchor="middle" fill="#59A56D" font-size="16" font-weight="600" letter-spacing="1.3">SPLIT BY CART VALUE AND CUSTOMER HISTORY</text>
</svg>