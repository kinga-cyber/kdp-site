<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif">
<rect width="1200" height="630" fill="#F6EFE6"/>
<text x="600.0" y="92" text-anchor="middle" fill="#3F455D" font-size="38" font-weight="600">Three providers, one bar</text>
<text x="600.0" y="134" text-anchor="middle" fill="#333333" font-size="20" opacity="0.85">Above 5,000 messages a day, all three enforce the same requirements.</text>
<rect x="185" y="196" width="250" height="72" rx="8" fill="#ffffff" stroke="#3F455D" stroke-width="2" stroke-opacity="0.4"/><text x="310" y="241" text-anchor="middle" fill="#3F455D" font-size="24" font-weight="600">Gmail</text><rect x="475" y="196" width="250" height="72" rx="8" fill="#ffffff" stroke="#3F455D" stroke-width="2" stroke-opacity="0.4"/><text x="600" y="241" text-anchor="middle" fill="#3F455D" font-size="24" font-weight="600">Yahoo</text><rect x="765" y="196" width="250" height="72" rx="8" fill="#ffffff" stroke="#3F455D" stroke-width="2" stroke-opacity="0.4"/><text x="890" y="241" text-anchor="middle" fill="#3F455D" font-size="24" font-weight="600">Outlook</text><rect x="185" y="326" width="830" height="60" rx="8" fill="#59A56D" fill-opacity="0.13" stroke="#59A56D" stroke-width="2"/><text x="213" y="363" fill="#3F455D" font-size="21" font-weight="600">SPF + DKIM</text><text x="987" y="363" text-anchor="end" fill="#333333" font-size="17" opacity="0.75">both, not either</text><rect x="185" y="402" width="830" height="60" rx="8" fill="#59A56D" fill-opacity="0.13" stroke="#59A56D" stroke-width="2"/><text x="213" y="439" fill="#3F455D" font-size="21" font-weight="600">DMARC</text><text x="987" y="439" text-anchor="end" fill="#333333" font-size="17" opacity="0.75">with alignment</text><rect x="185" y="478" width="830" height="60" rx="8" fill="#59A56D" fill-opacity="0.13" stroke="#59A56D" stroke-width="2"/><text x="213" y="515" fill="#3F455D" font-size="21" font-weight="600">One-click unsubscribe</text><text x="987" y="515" text-anchor="end" fill="#333333" font-size="17" opacity="0.75">honoured in 2 days</text>
<text x="600.0" y="590" text-anchor="middle" fill="#BA9200" font-size="19" font-weight="600">Spam complaints: under 0.10% is the target. 0.30% is the cliff.</text>
</svg>