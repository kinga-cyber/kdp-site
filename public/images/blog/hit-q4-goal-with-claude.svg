<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif">
<rect width="1200" height="630" fill="#F6EFE6"/>
<text x="60" y="56" fill="#3F455D" font-size="14" font-weight="600" opacity="0.6" letter-spacing="2">Q4, WEEK BY WEEK</text>
<text x="60" y="102" fill="#3F455D" font-size="34" font-weight="600">Hit your Q4 goal, week by week, with Claude</text>
<text x="60" y="136" fill="#333333" font-size="19" font-weight="400" opacity="0.85">A number for every department, the data every Monday, and a standup to fix what’s behind.</text>
<rect x="60" y="166" width="1080" height="56" rx="10" fill="#BA9200" fill-opacity="0.12" stroke="#BA9200" stroke-opacity="0.75" stroke-width="2"/>
<text x="600" y="201" fill="#3F455D" font-size="20" font-weight="600" text-anchor="middle">Goal: the Q4 revenue plan, set month by month</text>
<line x1="230.0" y1="222" x2="230.0" y2="246" stroke="#3F455D" stroke-opacity="0.4" stroke-width="2"/>
<rect x="60" y="246" width="340" height="178" rx="10" fill="#FFFFFF" stroke="#3F455D" stroke-opacity="0.4" stroke-width="1.5"/>
<text x="230.0" y="288" fill="#3F455D" font-size="21" font-weight="600" text-anchor="middle">1. Connect the data</text>
<line x1="84" y1="306" x2="376" y2="306" stroke="#3F455D" stroke-opacity="0.15"/>
<text x="84" y="338" fill="#333333" font-size="17" font-weight="400">Store, Klaviyo, GA4,</text>
<text x="84" y="366" fill="#333333" font-size="17" font-weight="400">Google Ads and Meta,</text>
<text x="84" y="394" fill="#333333" font-size="17" font-weight="400">pulled by Claude weekly</text>
<line x1="600.0" y1="222" x2="600.0" y2="246" stroke="#3F455D" stroke-opacity="0.4" stroke-width="2"/>
<rect x="430" y="246" width="340" height="178" rx="10" fill="#FFFFFF" stroke="#3F455D" stroke-opacity="0.4" stroke-width="1.5"/>
<text x="600.0" y="288" fill="#3F455D" font-size="21" font-weight="600" text-anchor="middle">2. Set the benchmarks</text>
<line x1="454" y1="306" x2="746" y2="306" stroke="#3F455D" stroke-opacity="0.15"/>
<text x="454" y="338" fill="#333333" font-size="17" font-weight="400">From your own history:</text>
<text x="454" y="366" fill="#333333" font-size="17" font-weight="400">a number for every</text>
<text x="454" y="394" fill="#333333" font-size="17" font-weight="400">department, one owner each</text>
<line x1="970.0" y1="222" x2="970.0" y2="246" stroke="#3F455D" stroke-opacity="0.4" stroke-width="2"/>
<rect x="800" y="246" width="340" height="178" rx="10" fill="#FFFFFF" stroke="#3F455D" stroke-opacity="0.4" stroke-width="1.5"/>
<text x="970.0" y="288" fill="#3F455D" font-size="21" font-weight="600" text-anchor="middle">3. Track every week</text>
<line x1="824" y1="306" x2="1116" y2="306" stroke="#3F455D" stroke-opacity="0.15"/>
<text x="824" y="338" fill="#333333" font-size="17" font-weight="400">One page: goal vs actual</text>
<text x="824" y="366" fill="#333333" font-size="17" font-weight="400">A weekly standup:</text>
<text x="824" y="394" fill="#333333" font-size="17" font-weight="400">on target, or troubleshoot</text>
<rect x="60" y="446" width="1080" height="118" rx="10" fill="#3F455D" fill-opacity="0.06" stroke="#3F455D" stroke-opacity="0.3" stroke-width="1.5"/>
<text x="600" y="480" fill="#3F455D" font-size="19" font-weight="600" text-anchor="middle">Every department works from the same page</text>
<rect x="93.0" y="500" width="190" height="40" rx="8" fill="#FFFFFF" stroke="#3F455D" stroke-opacity="0.35" stroke-width="1.2"/>
<text x="188.0" y="526" fill="#3F455D" font-size="16" font-weight="500" text-anchor="middle">Paid media</text>
<rect x="299.0" y="500" width="190" height="40" rx="8" fill="#FFFFFF" stroke="#3F455D" stroke-opacity="0.35" stroke-width="1.2"/>
<text x="394.0" y="526" fill="#3F455D" font-size="16" font-weight="500" text-anchor="middle">Email and SMS</text>
<rect x="505.0" y="500" width="190" height="40" rx="8" fill="#FFFFFF" stroke="#3F455D" stroke-opacity="0.35" stroke-width="1.2"/>
<text x="600.0" y="526" fill="#3F455D" font-size="16" font-weight="500" text-anchor="middle">Pop-ups and list</text>
<rect x="711.0" y="500" width="190" height="40" rx="8" fill="#FFFFFF" stroke="#3F455D" stroke-opacity="0.35" stroke-width="1.2"/>
<text x="806.0" y="526" fill="#3F455D" font-size="16" font-weight="500" text-anchor="middle">Site and organic</text>
<rect x="917.0" y="500" width="190" height="40" rx="8" fill="#FFFFFF" stroke="#3F455D" stroke-opacity="0.35" stroke-width="1.2"/>
<text x="1012.0" y="526" fill="#3F455D" font-size="16" font-weight="500" text-anchor="middle">Retention and B2B</text>
<line x1="60" y1="590" x2="1140" y2="590" stroke="#BA9200" stroke-opacity="0.35"/>
<text x="60" y="618" fill="#3F455D" font-size="14" font-weight="600" opacity="0.6" letter-spacing="1">kingadow.com</text>
</svg>