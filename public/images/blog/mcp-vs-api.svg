<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif">
<rect width="1200" height="630" fill="#F6EFE6"/>
<text x="60" y="54" fill="#3F455D" font-size="14" font-weight="600" letter-spacing="2" opacity="0.6">MCP OR THE API</text>
<text x="60" y="100" fill="#3F455D" font-size="34" font-weight="600">The connector is a slice someone chose</text>
<text x="60" y="134" fill="#333333" font-size="19" opacity="0.85">It builds most of the account. The API reaches further. A person checks it.</text>
<rect x="60" y="172" width="780" height="356" rx="10" fill="#FFFFFF" stroke="#3F455D" stroke-opacity="0.5" stroke-width="2"/>
<text x="84" y="206" fill="#3F455D" font-size="13" font-weight="700" letter-spacing="1.6" opacity="0.7">REST API  ·  THE FULL SURFACE</text>
<rect x="84" y="226" width="474" height="282" rx="9" fill="#59A56D" fill-opacity="0.12" stroke="#59A56D" stroke-opacity="0.55"/>
<text x="106" y="258" fill="#59A56D" font-size="13" font-weight="700" letter-spacing="1.6">MCP CONNECTOR  ·  ~250 TOOLS</text>
<g font-size="15.5" font-weight="500" fill="#3F455D">
<rect x="106" y="276" width="212" height="34" rx="17" fill="#59A56D" fill-opacity="0.16" stroke="#59A56D" stroke-opacity="0.45"/><text x="124" y="298">Campaigns</text>
<rect x="330" y="276" width="212" height="34" rx="17" fill="#59A56D" fill-opacity="0.16" stroke="#59A56D" stroke-opacity="0.45"/><text x="348" y="298">Flows</text>
<rect x="106" y="318" width="212" height="34" rx="17" fill="#59A56D" fill-opacity="0.16" stroke="#59A56D" stroke-opacity="0.45"/><text x="124" y="340">Segments</text>
<rect x="330" y="318" width="212" height="34" rx="17" fill="#59A56D" fill-opacity="0.16" stroke="#59A56D" stroke-opacity="0.45"/><text x="348" y="340">Lists</text>
<rect x="106" y="360" width="212" height="34" rx="17" fill="#59A56D" fill-opacity="0.16" stroke="#59A56D" stroke-opacity="0.45"/><text x="124" y="382">Templates</text>
<rect x="330" y="360" width="212" height="34" rx="17" fill="#59A56D" fill-opacity="0.16" stroke="#59A56D" stroke-opacity="0.45"/><text x="348" y="382">Sign-up forms</text>
<rect x="106" y="402" width="212" height="34" rx="17" fill="#59A56D" fill-opacity="0.16" stroke="#59A56D" stroke-opacity="0.45"/><text x="124" y="424">Profiles</text>
<rect x="330" y="402" width="212" height="34" rx="17" fill="#59A56D" fill-opacity="0.16" stroke="#59A56D" stroke-opacity="0.45"/><text x="348" y="424">Coupons</text>
<rect x="106" y="444" width="212" height="34" rx="17" fill="#59A56D" fill-opacity="0.16" stroke="#59A56D" stroke-opacity="0.45"/><text x="124" y="466">Catalog</text>
<rect x="330" y="444" width="212" height="34" rx="17" fill="#59A56D" fill-opacity="0.16" stroke="#59A56D" stroke-opacity="0.45"/><text x="348" y="466">Reporting</text>
</g>
<text x="106" y="498" fill="#333333" font-size="14" opacity="0.7">Builds most of the account</text>
<text x="578" y="258" fill="#BA9200" font-size="13" font-weight="700" letter-spacing="1.6">API ONLY</text>
<g font-size="15.5" font-weight="500" fill="#3F455D">
<rect x="578" y="276" width="240" height="34" rx="17" fill="#BA9200" fill-opacity="0.15" stroke="#BA9200" stroke-opacity="0.45"/><text x="596" y="298">Create a webhook</text>
<rect x="578" y="318" width="240" height="34" rx="17" fill="#BA9200" fill-opacity="0.15" stroke="#BA9200" stroke-opacity="0.45"/><text x="596" y="340">Change a webhook</text>
<rect x="578" y="360" width="240" height="34" rx="17" fill="#BA9200" fill-opacity="0.15" stroke="#BA9200" stroke-opacity="0.45"/><text x="596" y="382">Edit a built form</text>
<rect x="578" y="402" width="240" height="34" rx="17" fill="#BA9200" fill-opacity="0.15" stroke="#BA9200" stroke-opacity="0.45"/><text x="596" y="424">Run many accounts</text>
</g>
<text x="578" y="498" fill="#333333" font-size="14" opacity="0.7">Reaches further</text>
<rect x="864" y="172" width="276" height="356" rx="10" fill="#FFFFFF" stroke="#3F455D" stroke-opacity="0.5" stroke-width="2"/>
<text x="888" y="206" fill="#3F455D" font-size="13" font-weight="700" letter-spacing="1.6" opacity="0.7">INTERFACE</text>
<text x="888" y="258" fill="#3F455D" font-size="13" font-weight="700" letter-spacing="1.6">A PERSON</text>
