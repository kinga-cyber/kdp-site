<rect x="888" y="276" width="228" height="34" rx="17" fill="#3F455D" fill-opacity="0.08" stroke="#3F455D" stroke-opacity="0.35"/><text x="906" y="298">Review before live</text>
<rect x="888" y="318" width="228" height="34" rx="17" fill="#3F455D" fill-opacity="0.08" stroke="#3F455D" stroke-opacity="0.35"/><text x="906" y="340">Deliverability</text>
<rect x="888" y="360" width="228" height="34" rx="17" fill="#3F455D" fill-opacity="0.08" stroke="#3F455D" stroke-opacity="0.35"/><text x="906" y="382">Connect Shopify</text>
<rect x="888" y="402" width="228" height="34" rx="17" fill="#3F455D" fill-opacity="0.08" stroke="#3F455D" stroke-opacity="0.35"/><text x="906" y="424">Billing and account</text>
</g>
<text x="888" y="498" fill="#333333" font-size="14" opacity="0.7">Checks and decides</text>
<line x1="60" y1="556" x2="1140" y2="556" stroke="#BA9200" stroke-opacity="0.35"/>
<text x="60" y="590" fill="#3F455D" font-size="18" opacity="0.8">The connector and the API do the building. A person checks and decides.</text>
</svg>
