<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1528" width="1200" height="1528" font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif">
<rect width="1200" height="1528" fill="#F6EFE6"/>
<text x="50" y="56" fill="#3F455D" font-size="14" font-weight="600" letter-spacing="2" opacity="0.6">FLOW STRUCTURE</text>
<text x="50" y="104" fill="#3F455D" font-size="34" font-weight="600">Abandoned cart, split by purchase history</text>
<text x="50" y="140" fill="#333333" font-size="19" opacity="0.85">Two paths from one trigger. Same timing, different job for the middle email.</text>
<rect x="400" y="196" width="400" height="122" rx="7" fill="#FFFFFF" fill-opacity="1" stroke="#3F455D" stroke-opacity="0.45"/>
<text x="430" y="232" fill="#3F455D" font-size="12.5" font-weight="700" letter-spacing="1.5">TRIGGER</text>
<text x="430" y="266" fill="#3F455D" font-size="21" font-weight="600">Started checkout</text>
<text x="430" y="294" fill="#333333" font-size="16" opacity="0.75">Fires when a cart enters checkout</text>
<line x1="600" y1="318" x2="600" y2="350" stroke="#3F455D" stroke-opacity="0.5" stroke-width="2"/>
<path d="M594,349 L600,360 L606,349 Z" fill="#3F455D" fill-opacity="0.5"/>
<rect x="390" y="360" width="420" height="92" rx="7" fill="#59A56D" fill-opacity="0.14" stroke="#59A56D" stroke-opacity="0.45"/>
<text x="420" y="396" fill="#59A56D" font-size="12.5" font-weight="700" letter-spacing="1.5">FLOW FILTER</text>
<text x="420" y="430" fill="#3F455D" font-size="21" font-weight="600">Has this person ordered before?</text>
<line x1="600" y1="452" x2="600" y2="478" stroke="#3F455D" stroke-opacity="0.5" stroke-width="2"/>
<line x1="322" y1="478" x2="877" y2="478" stroke="#3F455D" stroke-opacity="0.5" stroke-width="2"/>
