name: Weekly publish

# Posts are date-gated at build time (see src/lib/posts.ts), so a post dated in
# the future stays hidden until a build runs on or after that date. This is the
# build that runs on the date.
#
# Without this workflow the date gate would be a trap: scheduled posts would be
# excluded from every build and never appear at all.

on:
  schedule:
    # Thursday 10:00 UTC = 6am EDT / 5am EST.
    # GitHub cron is UTC only and does not follow daylight saving.
    # Free-tier scheduled runs are queued and can be delayed 15-60 minutes.
    #
    # Moved earlier from 13:00 UTC on 2026-07-31. The subscriber email that
    # announces the post is scheduled for 9:15am Eastern, and the post has to be
    # live before that time can be scheduled. Publishing at 6am leaves roughly
    # three hours of headroom, which absorbs a worst-case queue delay plus the
    # Netlify build. Nobody sees the post until the email goes out, so the
    # earlier publish costs nothing.
    #
    # If you move this later, move the send time in blog-email.yml too.
    - cron: "0 10 * * 4"

  # Adds a "Run workflow" button in the Actions tab, for publishing something
  # that should not wait for Thursday.
  workflow_dispatch:

jobs:
  trigger-build:
    name: Trigger Netlify build
    runs-on: ubuntu-latest
    steps:
      - name: POST to the Netlify build hook
        run: |
          if [ -z "${{ secrets.NETLIFY_BUILD_HOOK }}" ]; then
            echo "::error::NETLIFY_BUILD_HOOK secret is not set."
            echo "Create a build hook in Netlify (Site settings > Build & deploy >"
            echo "Build hooks, branch main), then add the URL as a repository"
            echo "secret named NETLIFY_BUILD_HOOK."
            exit 1
          fi
          curl -fsSL --retry 3 --retry-delay 10 \
            -X POST -d '{}' "${{ secrets.NETLIFY_BUILD_HOOK }}"
          echo "Build triggered."
