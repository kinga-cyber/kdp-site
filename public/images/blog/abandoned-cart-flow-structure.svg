<path d="M316,513 L322,524 L328,513 Z" fill="#3F455D" fill-opacity="0.5"/>
<line x1="877" y1="478" x2="877" y2="514" stroke="#3F455D" stroke-opacity="0.5" stroke-width="2"/>
<path d="M871,513 L877,524 L883,513 Z" fill="#3F455D" fill-opacity="0.5"/>
<rect x="50" y="524" width="545" height="122" rx="7" fill="#FFFFFF" fill-opacity="1" stroke="#3F455D" stroke-opacity="0.45"/>
<text x="80" y="560" fill="#3F455D" font-size="12.5" font-weight="700" letter-spacing="1.5">YES  ·  EXISTING CUSTOMER</text>
<text x="80" y="594" fill="#3F455D" font-size="21" font-weight="600">Buyer path</text>
<text x="80" y="622" fill="#333333" font-size="16" opacity="0.75">They already know you are real</text>
<rect x="605" y="524" width="545" height="122" rx="7" fill="#FFFFFF" fill-opacity="1" stroke="#BA9200" stroke-opacity="0.45"/>
<text x="635" y="560" fill="#BA9200" font-size="12.5" font-weight="700" letter-spacing="1.5">NO  ·  FIRST PURCHASE</text>
<text x="635" y="594" fill="#3F455D" font-size="21" font-weight="600">Non-buyer path</text>
<text x="635" y="622" fill="#333333" font-size="16" opacity="0.75">Every objection is still open</text>
<rect x="50" y="668" width="545" height="92" rx="7" fill="#3F455D" fill-opacity="0.07" stroke="#3F455D" stroke-opacity="0.45"/>
<text x="80" y="704" fill="#3F455D" font-size="12.5" font-weight="700" letter-spacing="1.5">CONDITIONAL BLOCK</text>
<text x="80" y="738" fill="#3F455D" font-size="21" font-weight="600">Loyalty balance reminder</text>
<rect x="605" y="668" width="545" height="92" rx="7" fill="#BA9200" fill-opacity="0.09" stroke="#BA9200" stroke-opacity="0.45"/>
<text x="635" y="704" fill="#BA9200" font-size="12.5" font-weight="700" letter-spacing="1.5">SPLIT</text>
<text x="635" y="738" fill="#3F455D" font-size="21" font-weight="600">Above or below free shipping</text>
<rect x="50" y="790" width="545" height="134" rx="7" fill="#FFFFFF" stroke="#3F455D" stroke-opacity="0.35"/>
<rect x="80" y="814" width="128" height="28" rx="14" fill="#3F455D" fill-opacity="0.13"/>
<text x="144" y="833" text-anchor="middle" fill="#3F455D" font-size="13" font-weight="700">Wait 1 hour</text>
<text x="80" y="874" fill="#3F455D" font-size="21" font-weight="600">Reminder, no discount</text>
<text x="80" y="902" fill="#333333" font-size="16" opacity="0.75">Just a link back to the cart</text>
<rect x="605" y="790" width="545" height="134" rx="7" fill="#FFFFFF" stroke="#BA9200" stroke-opacity="0.35"/>
<rect x="635" y="814" width="128" height="28" rx="14" fill="#BA9200" fill-opacity="0.13"/>
<text x="699" y="833" text-anchor="middle" fill="#BA9200" font-size="13" font-weight="700">Wait 1 hour</text>
<text x="635" y="874" fill="#3F455D" font-size="21" font-weight="600">Reminder, no discount</text>
<text x="635" y="902" fill="#333333" font-size="16" opacity="0.75">Just a link back to the cart</text>
<rect x="50" y="946" width="545" height="134" rx="7" fill="#FFFFFF" stroke="#3F455D" stroke-opacity="0.35"/>
<rect x="80" y="970" width="128" height="28" rx="14" fill="#3F455D" fill-opacity="0.13"/>
<text x="144" y="989" text-anchor="middle" fill="#3F455D" font-size="13" font-weight="700">Wait +1 day</text>
<text x="80" y="1030" fill="#3F455D" font-size="21" font-weight="600">Delivery and timing</text>
<text x="80" y="1058" fill="#333333" font-size="16" opacity="0.75">No trust building needed here</text>
<rect x="605" y="946" width="545" height="134" rx="7" fill="#FFFFFF" stroke="#BA9200" stroke-opacity="0.35"/>
<rect x="635" y="970" width="128" height="28" rx="14" fill="#BA9200" fill-opacity="0.13"/>
<text x="699" y="989" text-anchor="middle" fill="#BA9200" font-size="13" font-weight="700">Wait +1 day</text>
<text x="635" y="1030" fill="#3F455D" font-size="21" font-weight="600">Reviews, returns, sizing</text>
<text x="635" y="1058" fill="#333333" font-size="16" opacity="0.75">Handle the reason they hesitated</text>
<rect x="50" y="1102" width="545" height="134" rx="7" fill="#FFFFFF" stroke="#3F455D" stroke-opacity="0.35"/>
<rect x="80" y="1126" width="128" height="28" rx="14" fill="#3F455D" fill-opacity="0.13"/>
<text x="144" y="1145" text-anchor="middle" fill="#3F455D" font-size="13" font-weight="700">Wait +3 days</text>
<text x="80" y="1186" fill="#3F455D" font-size="21" font-weight="600">Incentive, if you use one</text>
<text x="80" y="1214" fill="#333333" font-size="16" opacity="0.75">The only group where it buys something</text>
<rect x="605" y="1102" width="545" height="134" rx="7" fill="#FFFFFF" stroke="#BA9200" stroke-opacity="0.35"/>
<rect x="635" y="1126" width="128" height="28" rx="14" fill="#BA9200" fill-opacity="0.13"/>
<text x="699" y="1145" text-anchor="middle" fill="#BA9200" font-size="13" font-weight="700">Wait +3 days</text>
<text x="635" y="1186" fill="#3F455D" font-size="21" font-weight="600">Incentive, if you use one</text>
<text x="635" y="1214" fill="#333333" font-size="16" opacity="0.75">The only group where it buys something</text>
<rect x="50" y="1276" width="1100" height="202" rx="7" fill="#FFFFFF" stroke="#3F455D" stroke-opacity="0.25"/>
<text x="80" y="1316" fill="#3F455D" font-size="13" font-weight="700" letter-spacing="1.5" opacity="0.65">NOTES</text>
<text x="80" y="1354" fill="#333333" font-size="16" opacity="0.85">·  Both paths share the same timing. Only the middle email changes.</text>
<text x="80" y="1384" fill="#333333" font-size="16" opacity="0.85">·  No discount in the first email on either path. It buys nothing that a link would not.</text>
<text x="80" y="1414" fill="#333333" font-size="16" opacity="0.85">·  The flow must stop on purchase. This is the most common broken thing in accounts.</text>
<text x="80" y="1444" fill="#333333" font-size="16" opacity="0.85">·  Splitting on cart value can sit on top of this, and is usually worth more than a fourth email.</text>
</svg>