<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif">
<rect width="1200" height="650" fill="#F6EFE6"/>
<text x="60" y="56" fill="#3F455D" font-size="14" font-weight="600" opacity="0.6" letter-spacing="2">WHERE THE NUMBERS COME FROM</text>
<text x="60" y="102" fill="#3F455D" font-size="34" font-weight="600">Every department reports into one weekly page</text>
<text x="60" y="136" fill="#333333" font-size="19" font-weight="400" opacity="0.85">Claude pulls the data every Monday. The team decides what to do about it.</text>
<rect x="60" y="240" width="270" height="120" rx="10" fill="#FFFFFF" stroke="#3F455D" stroke-opacity="0.4" stroke-width="1.5"/>
<text x="84" y="282" fill="#3F455D" font-size="21" font-weight="600">Goals page</text>
<text x="84" y="312" fill="#333333" font-size="17" font-weight="400">Each department sets</text>
<text x="84" y="338" fill="#333333" font-size="17" font-weight="400">its monthly projections</text>
<rect x="450" y="214" width="300" height="172" rx="10" fill="#BA9200" fill-opacity="0.09" stroke="#BA9200" stroke-opacity="0.75" stroke-width="2.5"/>
<text x="600" y="256" fill="#3F455D" font-size="23" font-weight="600" text-anchor="middle">Weekly KPI page</text>
<text x="600" y="290" fill="#333333" font-size="17" font-weight="400" text-anchor="middle">Goal against actual</text>
<text x="600" y="316" fill="#333333" font-size="17" font-weight="400" text-anchor="middle">for every department</text>
<text x="600" y="342" fill="#333333" font-size="17" font-weight="400" text-anchor="middle">One owner per number</text>
<text x="600" y="368" fill="#333333" font-size="17" font-weight="400" text-anchor="middle">Due Mondays at noon</text>
<rect x="870" y="240" width="270" height="120" rx="10" fill="#FFFFFF" stroke="#3F455D" stroke-opacity="0.4" stroke-width="1.5"/>
<text x="894" y="282" fill="#3F455D" font-size="21" font-weight="600">Weekly standup</text>
<text x="894" y="312" fill="#333333" font-size="17" font-weight="400">On target? Move on.</text>
<text x="894" y="338" fill="#333333" font-size="17" font-weight="400">Behind? Fix it together.</text>
<path d="M 330 300 L 446 300" fill="none" stroke="#3F455D" stroke-opacity="0.4" stroke-width="2"/>
<path d="M 440 295 L 448 300 L 440 305" fill="none" stroke="#3F455D" stroke-opacity="0.5" stroke-width="2"/>
<path d="M 750 300 L 866 300" fill="none" stroke="#3F455D" stroke-opacity="0.4" stroke-width="2"/>
<path d="M 860 295 L 868 300 L 860 305" fill="none" stroke="#3F455D" stroke-opacity="0.5" stroke-width="2"/>
<rect x="60" y="476" width="330" height="124" rx="10" fill="#FFFFFF" stroke="#3F455D" stroke-opacity="0.4" stroke-width="1.5"/>
<text x="84" y="516" fill="#3F455D" font-size="20" font-weight="600">Store site</text>
<text x="84" y="546" fill="#333333" font-size="17" font-weight="400">Orders, sales, new vs returning</text>
<text x="84" y="576" fill="#3F455D" font-size="16" font-weight="400" opacity="0.6">Calculated on the page</text>
<rect x="435" y="476" width="330" height="124" rx="10" fill="#FFFFFF" stroke="#3F455D" stroke-opacity="0.4" stroke-width="1.5"/>
<text x="459" y="516" fill="#3F455D" font-size="20" font-weight="600">Klaviyo</text>
<text x="459" y="546" fill="#333333" font-size="17" font-weight="400">Email, SMS and pop-up results</text>
<text x="459" y="576" fill="#3F455D" font-size="16" font-weight="400" opacity="0.6">Pulled by a Claude routine</text>
<rect x="810" y="476" width="330" height="124" rx="10" fill="#FFFFFF" stroke="#3F455D" stroke-opacity="0.4" stroke-width="1.5"/>
<text x="834" y="516" fill="#3F455D" font-size="20" font-weight="600">GA4, Google Ads, Meta</text>
<text x="834" y="546" fill="#333333" font-size="17" font-weight="400">Traffic and ad spend</text>
<text x="834" y="576" fill="#3F455D" font-size="16" font-weight="400" opacity="0.6">Pulled by connector too</text>
<path d="M 600 476 L 600 390" fill="none" stroke="#3F455D" stroke-opacity="0.4" stroke-width="2"/>
<path d="M 595 396 L 600 388 L 605 396" fill="none" stroke="#3F455D" stroke-opacity="0.5" stroke-width="2"/>
<path d="M 225 476 L 225 432 L 560 432 L 560 390" fill="none" stroke="#3F455D" stroke-opacity="0.4" stroke-width="2"/>
<path d="M 555 396 L 560 388 L 565 396" fill="none" stroke="#3F455D" stroke-opacity="0.5" stroke-width="2"/>
<path d="M 975 476 L 975 432 L 640 432 L 640 390" fill="none" stroke="#3F455D" stroke-opacity="0.4" stroke-width="2"/>
<path d="M 635 396 L 640 388 L 645 396" fill="none" stroke="#3F455D" stroke-opacity="0.5" stroke-width="2"/>
</svg>